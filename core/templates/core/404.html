{% extends "base.html" %}
{% block title %}Page Not Found | {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="section container text-center" style="padding: 90px 20px;">
  <div class="stat-icon amber" style="margin: 0 auto 20px; width: 56px; height: 56px; font-size: 1.5rem;">404</div>
  <h1 class="mt-0" style="font-size: 2rem;">Page Not Found</h1>
  <p class="subtle" style="max-width: 440px; margin: 0 auto 24px;">The link you followed may be broken or the page may have been moved.</p>
  <a href="{% url 'core:home' %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
