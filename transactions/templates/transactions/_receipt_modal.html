<!-- Popup Receipt Modal for Transaction #{{ transaction.reference }} -->
<div id="receipt-modal-{{ transaction.reference }}" class="modal-backdrop receipt-modal no-print" role="dialog" aria-modal="true" aria-labelledby="receipt-title-{{ transaction.reference }}">
  <div class="receipt-modal-dialog">
    <button type="button" class="modal-close-btn no-print" data-close-modal title="Close receipt">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    {% include "transactions/_receipt_card.html" with transaction=transaction %}

    <!-- Modal Footer Controls -->
    <div class="modal-footer-bar no-print">
      <button type="button" class="btn btn-sm btn-outline" data-close-modal>
        Close
      </button>
      <div style="display: flex; gap: 10px;">
        <a href="{% url 'transactions:receipt' transaction.reference %}" class="btn btn-sm btn-outline" target="_blank" title="Open full receipt page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open Page
        </a>
        <button type="button" onclick="window.print()" class="btn btn-sm btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          Print Receipt
        </button>
      </div>
    </div>
  </div>
</div>
