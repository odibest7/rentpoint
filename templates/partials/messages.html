{% if messages %}
  <div class="alert-list">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" class="alert-dismiss" data-dismiss-alert aria-label="Dismiss message">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
