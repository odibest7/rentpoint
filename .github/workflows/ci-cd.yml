name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  security-and-lint:
    name: Security & Code Quality Scan
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: 'ci-testing-secret-key-rentpoint-not-for-production'
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-libmysqlclient-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit

      - name: Django System Check
        run: |
          python manage.py check

      - name: Lint with Flake8
        run: |
          # Fail on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other style issues as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r . \
          --exclude ./venv,./.venv,./core/tests.py,./accounts/tests.py,./listings/tests.py,./transactions/tests.py,./wallet/tests.py \
          --severity-level medium \
          --confidence-level medium

      - name: Dependency Security Scan (pip-audit)
        run: |
          pip-audit -r requirements.txt --desc

  test:
    name: Run Automated Tests
    needs: security-and-lint
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: 'ci-testing-secret-key-rentpoint-not-for-production'
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-libmysqlclient-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: |
          python manage.py test --verbosity=2

  deliver-to-main:
    name: Deliver Passing Code to Main
    needs: [security-and-lint, test]
    if: github.ref != 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deliver / Merge to Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          git merge --no-ff ${{ github.sha }} -m "ci: auto-deliver verified code to main [skip ci]"
          git push origin main
